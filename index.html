<title>Slope</title>
<style>
  /* (a phone: the page does not scroll, bounce, zoom or select, and a held finger opens no menu) */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; position: fixed; inset: 0;
               overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #000; touch-action: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             color: #0f0; font: 20px/1.4 Consolas, "Courier New", monospace; text-align: center; }
  /* (the box that asks for a file: a run to import, a picture for the custom skin) */
  #chooser { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; display: flex;
             flex-direction: column; gap: 14px; padding: 22px 26px; background: rgba(0, 8, 0, 0.97);
             border: 3px solid #0f0; touch-action: manipulation; }
  #chooser button { font: 18px/1.2 Consolas, "Courier New", monospace; color: #0f0; background: #021a02;
                    border: 2px solid #0f0; padding: 14px 22px; cursor: pointer; white-space: nowrap; }
  #chooser button:hover { background: #064006; }
  /* (files dragged over the page: what dropping them does) */
  #drophint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 6; pointer-events: none;
              padding: 12px 20px; background: rgba(0, 8, 0, 0.92); border: 3px dashed #0f0; color: #0f0;
              font: 17px/1.3 Consolas, "Courier New", monospace; text-align: center; max-width: 90%; }
  /* (a phone: the page's own text box, laid over the game's while it is typed in; the game
     draws the text, this one brings the keyboard, its paste and its selection) */
  #ime { position: fixed; z-index: 4; display: none; box-sizing: border-box; margin: 0; padding: 0 6px; border: 0;
         outline: none; background: transparent; color: transparent; caret-color: transparent;
         font: 16px/1 monospace; -webkit-user-select: text; user-select: text; touch-action: manipulation;
         -webkit-touch-callout: default; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="loading">SLOPE<br>loading...</div>
<canvas id="glcanvas" tabindex="1"></canvas>
<script>
  // A phone or a tablet: a touch screen as the thing that is pointed with. (?touch=1 says so by hand.)
  var slope_touch = /[?&]touch=1/.test(location.search) ||
    ((navigator.maxTouchPoints || 0) > 0 && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  // Phones have three or more of their own pixels to each one the page counts in. The game draws
  // in the screen's own pixels there, so the picture is sharp, but at no more than two to one:
  // that is sharp enough, and far less to draw. (?dpr=N says how many by hand.)
  (function () {
    var asked = /[?&]dpr=([\d.]+)/.exec(location.search);
    var dpr = asked ? +asked[1] : Math.min(window.devicePixelRatio || 1, 2);
    if (asked || dpr !== window.devicePixelRatio) {
      try { Object.defineProperty(window, "devicePixelRatio", { get: function () { return dpr; }, configurable: true }); } catch (e) {}
    }
  })();
  // A phone whose browser gives a page no full screen (an iPhone's), with the game open as a
  // page and not from the home screen: the game says there how it gets the whole screen.
  // (?ios=1 says so by hand.)
  var slope_home_hint = false;
  // The game's FULLSCREEN button: not every phone's browser can do it (an iPhone's cannot), and
  // one that will not must not stop the game.
  (function () {
    var canvas = document.getElementById("glcanvas");
    var enter = canvas.requestFullscreen || canvas.webkitRequestFullscreen;
    var media = function (q) { return !!window.matchMedia && window.matchMedia(q).matches; };
    var as_app = navigator.standalone === true || media("(display-mode: standalone)") || media("(display-mode: fullscreen)");
    slope_home_hint = /[?&]ios=1/.test(location.search) || (slope_touch && !enter && !as_app);
    canvas.requestFullscreen = function () {
      try { var p = enter && enter.call(canvas); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    };
    var leave = document.exitFullscreen || document.webkitExitFullscreen;
    document.exitFullscreen = function () {
      try { var p = leave && document.fullscreenElement && leave.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    };
    // (two fingers pinching, and a second tap, zoom nothing)
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
      document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
    });
    // the screen stays on while the game is in front (a phone dims it when nothing is touched,
    // which is what a run with the autopilot looks like to it)
    var lock = null;
    function awake() {
      if (!slope_touch || lock || !navigator.wakeLock || document.visibilityState !== "visible") return;
      navigator.wakeLock.request("screen").then(function (l) {
        lock = l;
        l.addEventListener("release", function () { lock = null; });
      }).catch(function () {});
    }
    document.addEventListener("touchend", awake);
    document.addEventListener("visibilitychange", awake);
    // Anti-aliasing (the settings): smooth edges or the original's jagged ones. A page can only
    // say yes or no, when its picture is first made, so a change shows after the page is loaded
    // again; how smooth is the browser's business.
    var smooth = true;
    try { smooth = JSON.parse(localStorage.getItem("slope:settings.json")).web_smooth !== false; } catch (e) {}
    var context = canvas.getContext;
    canvas.getContext = function (kind, wanted) {
      var w = {};
      for (var k in (wanted || {})) w[k] = wanted[k];
      w.antialias = smooth;
      return context.call(canvas, kind, w);
    };
  })();
</script>
<!-- frames -->
<script>
  // The FPS limit (the settings). The browser calls for a frame whenever the screen shows one;
  // with a limit set, a call that comes before the next frame is due is passed on to the screen's
  // next. So the game can be held below the screen's own rate (a phone with a fast screen lasts
  // longer on 60 than on 120), never above it.
  var slope_cap = 0;
  (function () {
    var ask = window.requestAnimationFrame.bind(window), drop = window.cancelAnimationFrame.bind(window);
    var waiting = {}, last = 0, due = 0;
    window.requestAnimationFrame = function (frame) {
      var id = ++last;
      function tick(t) {
        if (slope_cap > 0 && t < due - 1.5) { waiting[id] = ask(tick); return; }
        delete waiting[id];
        if (slope_cap > 0) {
          var every = 1000 / slope_cap;
          // (far behind, as after the page was hidden: counted from now)
          if (due < t - every) due = t;
          due += every;
        }
        frame(t);
      }
      waiting[id] = ask(tick);
      return id;
    };
    window.cancelAnimationFrame = function (id) {
      if (waiting[id] !== undefined) { drop(waiting[id]); delete waiting[id]; }
    };
  })();
</script>

<script src="mq_js_bundle.js"></script>
<script>
  // The game's sound. This takes the place of the drawing library's own (in mq_js_bundle.js),
  // whose music stayed silent on an iPhone (and in Firefox on a phone): browsers let a page's
  // sound start only in a press of the visitor's (their autoplay rules), and it tried that once,
  // at the very first touch of the screen, which a phone does not count as a press (only the
  // finger lifted is one), and then never again. (Chrome makes up for it by itself: it lets
  // the sound start when the music is started after any press; Safari and Firefox do not.) It
  // never woke the sound again after the phone had stopped it (a call, another app), and an
  // iPhone's silent switch silenced it. Here every press, key and finger lifted tries until
  // the sound runs, the music plays through the silent switch as a video's sound does, sounds
  // the browser cannot read are given up instead of keeping the game waiting at its start, and
  // everything goes through one volume.
  var slope_audio = { ctx: null, master: null, buffers: new Map(), plays: new Map() };
  (function () {
    var A = slope_audio, Ctx = window.AudioContext || window.webkitAudioContext, nextBuffer = 1, nextPlay = 1;
    function context() {
      if (A.ctx || !Ctx) return A.ctx;
      try { A.ctx = new Ctx(); } catch (e) { return null; }
      A.master = A.ctx.createGain();
      A.master.connect(A.ctx.destination);
      // (an iPhone plays a page's sound as background noise that its silent switch turns off,
      // unlike a video's: the game's music is played as a video's sound is)
      // ("ambient": the music mixes with what other apps play (Spotify goes on) and follows the
      // iPhone's silent switch, as game sounds should)
      try { if (navigator.audioSession) navigator.audioSession.type = "ambient"; } catch (e) {}
      return A.ctx;
    }
    function wake() {
      var c = context();
      if (!c || c.state === "running") return;
      try { var p = c.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
      // (an iPhone's: a sound started in the press itself)
      try { var s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); } catch (e) {}
    }
    ["pointerdown", "pointerup", "mousedown", "touchstart", "touchend", "keydown", "click"].forEach(function (n) {
      window.addEventListener(n, wake, { capture: true, passive: true });
    });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") wake(); });
    function stop(id) {
      var p = A.plays.get(id);
      if (!p) return;
      A.plays.delete(id);
      try { p.src.onended = null; p.src.stop(); } catch (e) {}
      try { p.src.disconnect(); p.gain.disconnect(); } catch (e) {}
    }
    miniquad_add_plugin({
      name: "slope_audio",
      version: 1,
      register_plugin: function (importObject) {
        var env = importObject.env;
        env.audio_init = function () { context(); };
        env.audio_add_buffer = function (at, len) {
          var id = nextBuffer++, c = context();
          if (!c) { A.buffers.set(id, null); return id; }
          var bytes = wasm_memory.buffer.slice(at, at + len);
          var done = false, put = function (b) { if (!done) { done = true; A.buffers.set(id, b); } };
          try {
            var p = c.decodeAudioData(bytes, put, function (e) { console.warn("a sound could not be read", e); put(null); });
            if (p && p.catch) p.catch(function () { put(null); });
          } catch (e) { put(null); }
          return id;
        };
        env.audio_source_is_loaded = function (id) { return A.buffers.has(id); };
        env.audio_play_buffer = function (id, volume, repeat) {
          var pid = nextPlay++, c = context(), b = A.buffers.get(id);
          if (!c || !b) return pid;
          var src = c.createBufferSource(), gain = c.createGain();
          src.buffer = b;
          src.loop = !!repeat;
          gain.gain.value = volume;
          src.connect(gain);
          gain.connect(A.master);
          src.onended = function () { stop(pid); };
          A.plays.set(pid, { sound: id, src: src, gain: gain });
          try { src.start(0); } catch (e) { stop(pid); }
          return pid;
        };
        env.audio_source_set_volume = function (id, volume) {
          A.plays.forEach(function (p) { if (p.sound === id) p.gain.gain.value = volume; });
        };
        env.audio_source_stop = function (id) {
          Array.from(A.plays.keys()).forEach(function (pid) { if (A.plays.get(pid).sound === id) stop(pid); });
        };
        env.audio_source_delete = function (id) { env.audio_source_stop(id); A.buffers.delete(id); };
        env.audio_playback_stop = function (pid) { stop(pid); };
        env.audio_playback_set_volume = function (pid, volume) { var p = A.plays.get(pid); if (p) p.gain.gain.value = volume; };
      }
    });
  })();
</script>
<!-- videos of saved runs and recordings of runs (encoded by the browser, made into MP4 files) -->
<script src="video.js"></script>
<script>
  // A file from the visitor's device: a run to import, a picture for the custom skin. The game
  // asks for one with a word of its own to know the answer by, and looks every frame whether it
  // has come: the word, a line break, the file's name, a line break, the file.
  var slope_picked = null;
  // A picture file (whatever kind the browser can open) as a PNG of no more than 512 pixels a
  // side: the browser's storage is small, and the game's textures are too.
  function slope_picture_png(file) {
    return new Promise(function (ok, no) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        try {
          var s = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight, 1));
          var c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.naturalWidth * s));
          c.height = Math.max(1, Math.round(img.naturalHeight * s));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function (blob) {
            if (!blob) { no(); return; }
            blob.arrayBuffer().then(function (b) { ok(new Uint8Array(b)); }, no);
          }, "image/png");
        } catch (e) { no(e); }
        URL.revokeObjectURL(url);
      };
      img.onerror = function () { URL.revokeObjectURL(url); no(); };
      img.src = url;
    });
  }
  // A file handed to the visitor: the browser saves it where it saves its downloads.
  function slope_save_blob(name, blob) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 120000);
  }
  // Files dropped on the page (pictures for the custom skin, a run file to import): pictures are
  // made PNGs as above, and every file waits for the game with its name and where it was
  // dropped (in the canvas's pixels).
  var slope_drops = [];
  (function () {
    var canvas = document.getElementById("glcanvas");
    var hint = null;
    var picture = function (f) { return /^image\//.test(f.type) || /\.(png|jpe?g|gif|webp|bmp|avif|svg|ico|tga)$/i.test(f.name); };
    function show(on) {
      if (on && !hint) {
        hint = document.createElement("div");
        hint.id = "drophint";
        hint.textContent = "DROP: pictures go on the custom skin, a .sloperun file joins the saved runs";
        document.body.appendChild(hint);
      } else if (!on && hint) { hint.remove(); hint = null; }
    }
    var leaving = 0;
    window.addEventListener("dragover", function (e) {
      if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") < 0) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      e.dataTransfer.dropEffect = "copy";
      show(true);
      clearTimeout(leaving);
      leaving = setTimeout(function () { show(false); }, 400);
    }, true);
    window.addEventListener("drop", function (e) {
      show(false);
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      var r = canvas.getBoundingClientRect();
      var x = (e.clientX - r.left) * canvas.width / Math.max(r.width, 1), y = (e.clientY - r.top) * canvas.height / Math.max(r.height, 1);
      // (all of one drop together: the game takes them as one, for the rows they go to)
      Promise.all(Array.prototype.map.call(e.dataTransfer.files, function (f) {
        var put = function (b) { return { name: f.name, x: x, y: y, bytes: b }; };
        var raw = function () { return f.arrayBuffer().then(function (b) { return put(new Uint8Array(b)); }, function () { return put(new Uint8Array(0)); }); };
        return picture(f) ? slope_picture_png(f).then(put, raw) : raw();
      })).then(function (all) { all.forEach(function (d) { slope_drops.push(d); }); });
      canvas.focus();
    }, true);
  })();
  function slope_choose(tag, pictures) {
    var canvas = document.getElementById("glcanvas");
    var old = document.getElementById("chooser");
    if (old) old.remove();
    var box = document.createElement("div");
    box.id = "chooser";
    var input = document.createElement("input");
    input.type = "file";
    input.style.display = "none";
    // (a phone's file list greys out kinds it does not know: any file may be picked there)
    if (pictures) input.accept = "image/*"; else if (!slope_touch) input.accept = ".sloperun";
    var choose = document.createElement("button");
    choose.textContent = pictures ? "CHOOSE A PICTURE" : "CHOOSE A RUN FILE";
    var cancel = document.createElement("button");
    cancel.textContent = "CANCEL";
    function close() { box.remove(); canvas.focus(); }
    function hand(name, bytes) {
      var head = new TextEncoder().encode(tag + "\n" + String(name).replace(/[\r\n]/g, " ") + "\n");
      var all = new Uint8Array(head.length + bytes.length);
      all.set(head, 0);
      all.set(bytes, head.length);
      slope_picked = all;
      close();
    }
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      if (!file) { close(); return; }
      var none = function () { hand(file.name, new Uint8Array(0)); };
      if (!pictures) {
        file.arrayBuffer().then(function (b) { hand(file.name, new Uint8Array(b)); }).catch(none);
        return;
      }
      slope_picture_png(file).then(function (b) { hand(file.name, b); }, none);
    });
    input.addEventListener("cancel", close);
    choose.addEventListener("click", function () { input.click(); });
    cancel.addEventListener("click", close);
    box.appendChild(choose);
    box.appendChild(cancel);
    box.appendChild(input);
    document.body.appendChild(box);
    // (where the browser lets a page open its file window without a press of the page's own
    // button, it is open already; where not, the button is there)
    try { input.click(); } catch (e) {}
  }
  // What the game keeps between visits (settings, high score, saved runs, the custom skin's
  // pictures): the browser's local storage. The game hands over text that sits in its own
  // memory, as (address, length); runs and pictures come as text too (base64).
  miniquad_add_plugin({
    name: "slope_store",
    version: 2,
    register_plugin: function (importObject) {
      const text = (at, len) => new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, at, len));
      // (bytes into the game's memory, if there is room for them: how many there are)
      const give = (bytes, buf, cap) => {
        if (cap >= bytes.length && bytes.length > 0) new Uint8Array(wasm_memory.buffer, buf, bytes.length).set(bytes);
        return bytes.length;
      };
      importObject.env.slope_store_set = function (key, keyLen, value, valueLen) {
        try { localStorage.setItem("slope:" + text(key, keyLen), text(value, valueLen)); return 1; } catch (e) { return 0; }
      };
      importObject.env.slope_store_remove = function (key, keyLen) {
        try { localStorage.removeItem("slope:" + text(key, keyLen)); } catch (e) {}
      };
      importObject.env.slope_store_list = function (buf, cap) {
        try {
          const names = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf("slope:") === 0) names.push(k.slice(6));
          }
          return give(new TextEncoder().encode(names.join("\n")), buf, cap);
        } catch (e) { return 0; }
      };
      // The floor is looked at almost edge-on: without this its lines blur to a green haze a few
      // cells away (anisotropic filtering for the texture that is bound, as the desktop game has it).
      importObject.env.slope_texture_aniso = function (level) {
        try {
          const ext = gl.getExtension("EXT_texture_filter_anisotropic") || gl.getExtension("WEBKIT_EXT_texture_filter_anisotropic");
          if (ext) gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(level, gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
        } catch (e) {}
      };
      // (the game asks once, as it starts: fingers steer there, and its menus are made to their size)
      importObject.env.slope_touch_device = function () { return slope_touch ? 1 : 0; };
      importObject.env.slope_home_hint = function () { return slope_home_hint ? 1 : 0; };
      importObject.env.slope_frame_cap = function (fps) { slope_cap = fps > 0 ? fps : 0; };
      importObject.env.slope_is_fullscreen = function () { return document.fullscreenElement || document.webkitFullscreenElement ? 1 : 0; };
      importObject.env.slope_store_get = function (key, keyLen, buf, cap) {
        try {
          const v = localStorage.getItem("slope:" + text(key, keyLen));
          if (v === null) return -1;
          const bytes = new TextEncoder().encode(v);
          if (cap >= bytes.length) new Uint8Array(wasm_memory.buffer, buf, bytes.length).set(bytes);
          return bytes.length;
        } catch (e) { return -1; }
      };
      // files in: the game asks for one, and takes it when it has come
      importObject.env.slope_pick_file = function (tag, tagLen, pictures) {
        try { slope_choose(text(tag, tagLen), pictures !== 0); } catch (e) {}
      };
      importObject.env.slope_picked_len = function () { return slope_picked ? slope_picked.length : -1; };
      importObject.env.slope_picked_take = function (buf, cap) {
        if (!slope_picked) return -1;
        const n = give(slope_picked, buf, cap);
        if (cap >= n) slope_picked = null;
        return n;
      };
      // files dropped on the page, one at a time: the name, a line break, "x y", a line break,
      // the file's bytes
      let dropping = null;
      importObject.env.slope_drop_len = function () {
        if (!dropping && slope_drops.length) {
          const d = slope_drops.shift();
          const head = new TextEncoder().encode(String(d.name).replace(/[\r\n]/g, " ") + "\n" + Math.round(d.x) + " " + Math.round(d.y) + "\n");
          dropping = new Uint8Array(head.length + d.bytes.length);
          dropping.set(head, 0);
          dropping.set(d.bytes, head.length);
        }
        return dropping ? dropping.length : -1;
      };
      importObject.env.slope_drop_take = function (buf, cap) {
        if (!dropping) return -1;
        const n = give(dropping, buf, cap);
        if (cap >= n) dropping = null;
        return n;
      };
      // a file out: the browser saves it where it saves its downloads
      importObject.env.slope_download = function (name, nameLen, data, dataLen) {
        try {
          slope_save_blob(text(name, nameLen), new Blob([new Uint8Array(wasm_memory.buffer, data, dataLen).slice()], { type: "application/octet-stream" }));
          return 1;
        } catch (e) { return 0; }
      };
    },
    on_init: function () {
      const l = document.getElementById("loading");
      if (l) l.remove();
    }
  });
  // Online play: the page holds the game's WebSocket to the multiplayer server (a page cannot
  // open plain TCP connections). Each message is one text message of JSON. The game hands over
  // the address and its messages as text in its memory, takes what came in one message at a
  // time, and asks how the connection stands (0 connecting, 1 open, 2 failed, 3 closed).
  // A page that came over https (GitHub Pages) can only open wss:// (TLS) connections: the
  // server must then be behind TLS (a proxy with a certificate). ws:// works from http:// pages
  // and from files on the computer.
  miniquad_add_plugin({
    name: "slope_net",
    version: 1,
    register_plugin: function (importObject) {
      const conns = new Map();
      let next = 1;
      const text = (at, len) => new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, at, len));
